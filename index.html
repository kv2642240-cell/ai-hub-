<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>The AI Hub - Ledger Manager</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { background: #0f0f1a; color: white; font-family: sans-serif; padding: 15px; }
        .box { max-width: 400px; margin: auto; background: #1a1a2e; padding: 20px; border-radius: 15px; border: 1px solid #7b2cbf; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; border-radius: 5px; border: none; }
        button { width: 100%; padding: 10px; background: #7b2cbf; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .record { background: #242442; padding: 10px; margin-top: 8px; border-radius: 5px; border-left: 4px solid #7b2cbf; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

<div class="box">
    <h2 style="text-align:center;">THE AI HUB</h2>
    <p style="text-align:center; font-size:0.8em;">Owner: Harshwardhan Singh Lodhi (Karan)</p>
    
    <input type="text" id="name" placeholder="Customer Name">
    <input type="text" id="product" placeholder="Service / Product Name">
    <input type="number" id="amt" placeholder="Amount (₹)">
    <select id="status">
        <option value="Paid">Paid (Paisa Mila)</option>
        <option value="Udhaar">Udhaar (Pending)</option>
    </select>
    
    <button onclick="saveData()">DOWNLOAD BILL & SAVE</button>
    
    <input type="text" id="search" placeholder="🔍 Search Customer Name..." onkeyup="loadData()">
    <div id="list" style="margin-top:20px;"></div>
    
    <div style="text-align:center; margin-top:20px; font-size: 0.8em;">
        📧 kv2642240@gmail.com | 📸 @_verma_karan08
    </div>
</div>

<script>
    function saveData() {
        let n = document.getElementById('name').value;
        let p = document.getElementById('product').value;
        let a = document.getElementById('amt').value;
        let s = document.getElementById('status').value;

        if(!n || !a || !p) return alert("Sabhi details bharein!");

        // 1. PDF Download
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.text("THE AI HUB - OFFICIAL RECEIPT", 50, 20);
        doc.text("Owner: Harshwardhan Singh Lodhi (Karan)", 20, 30);
        doc.text("---------------------------------------", 20, 35);
        doc.text("Customer: " + n, 20, 45);
        doc.text("Service: " + p, 20, 55);
        doc.text("Amount: ₹" + a, 20, 65);
        doc.text("Status: " + s, 20, 75);
        doc.save(n + "_bill.pdf");

        // 2. Save to Ledger
        let db = JSON.parse(localStorage.getItem('hub') || "[]");
        db.push({n, p, a, s, id: Date.now()});
        localStorage.setItem('hub', JSON.stringify(db));
        location.reload();
    }

    function loadData() {
        let q = document.getElementById('search').value.toLowerCase();
        let db = JSON.parse(localStorage.getItem('hub') || "[]");
        let list = document.getElementById('list');
        list.innerHTML = "";
        db.filter(i => i.n.toLowerCase().includes(q)).forEach(i => {
            list.innerHTML += `<div class="record">
                <div><strong>${i.n}</strong> (${i.s})<br>${i.p} | ₹${i.a}</div>
                <button onclick="del(${i.id})" style="width:auto; padding:5px; background:red;">Clear</button>
            </div>`;
        });
    }
    
    function del(id) {
        let db = JSON.parse(localStorage.getItem('hub')).filter(i => i.id !== id);
        localStorage.setItem('hub', JSON.stringify(db));
        loadData();
    }
    loadData();
</script>
</body>
</html>
