<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 THE AI HUB - WORKING BILL SYSTEM</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            color: white;
            padding: 2rem;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .content {
            padding: 2rem;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 1.5rem;
            border-radius: 15px;
            text-align: center;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
            color: #333;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 1rem;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #4ecdc4;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .btn {
            background: linear-gradient(45deg, #4ecdc4, #44a08d);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-right: 1rem;
            transition: transform 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-success {
            background: linear-gradient(45deg, #56ab2f, #a8e6cf);
        }

        .btn-danger {
            background: linear-gradient(45deg, #ff6b6b, #ee5a52);
        }

        #billPreview {
            background: white;
            border: 2px solid #4ecdc4;
            border-radius: 15px;
            padding: 2rem;
            margin-top: 2rem;
            display: none;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .customers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .customer-card {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 15px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .customer-card:hover {
            border-color: #4ecdc4;
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .customer-name {
            font-size: 1.4rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 0.5rem;
        }

        .customer-amount {
            font-size: 1.8rem;
            font-weight: bold;
            color: #27ae60;
            margin-bottom: 0.5rem;
        }

        .customer-date {
            color: #666;
            font-size: 0.9rem;
        }

        .search-box {
            width: 100%;
            max-width: 500px;
            margin: 0 auto 2rem;
            display: block;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #27ae60;
            color: white;
            padding: 1rem 2rem;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transform: translateX(300px);
            transition: transform 0.3s;
            z-index: 1000;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.error {
            background: #e74c3c;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Notification -->
    <div id="notification" class="notification" style="display: none;"></div>

    <div class="container">
        <div class="header">
            <h1><i class="fas fa-brain"></i> THE AI HUB</h1>
            <p>Harshwardhan Singh Lodhi | KV2642240@gmail.com | @_verma_karan08</p>
        </div>

        <div class="content">
            <!-- Live Stats -->
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-number" id="totalBills">0</div>
                    <span>Total Bills</span>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="totalProfit">$0</div>
                    <span>Total Profit</span>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="udhariAmount">$0</div>
                    <span>Udhari Pending</span>
                </div>
            </div>

            <!-- Quick Buttons -->
            <div style="text-align: center; margin-bottom: 2rem;">
                <button class="btn" onclick="showSection('new-bill')">
                    <i class="fas fa-plus"></i> New Bill
                </button>
                <button class="btn" onclick="showSection('search')">
                    <i class="fas fa-search"></i> Search Bills
                </button>
                <button class="btn" onclick="showSection('profit')">
                    <i class="fas fa-calculator"></i> Profit Calc
                </button>
            </div>

            <!-- New Bill Section -->
            <div id="new-bill" style="display: block;">
                <h2 style="text-align: center; margin-bottom: 2rem; color: #333;">
                    <i class="fas fa-receipt"></i> Create New Bill
                </h2>

                <div class="form-row">
                    <div class="form-group">
                        <label><i class="fas fa-user"></i> Customer Name *</label>
                        <input type="text" id="customerName" placeholder="Enter name" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-phone"></i> Phone</label>
                        <input type="tel" id="customerPhone" placeholder="Phone number">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label><i class="fas fa-rupee-sign"></i> Total Amount *</label>
                        <input type="number" id="billAmount" placeholder="0" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-credit-card"></i> Payment</label>
                        <select id="paymentType">
                            <option value="Cash">Cash</option>
                            <option value="UPI">UPI</option>
                            <option value="Card">Card</option>
                            <option value="Udhari">Udhari</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-list"></i> Items</label>
                    <textarea id="items" rows="3" placeholder="Shirt x2, Pant x1 etc..."></textarea>
                </div>

                <div style="text-align: center;">
                    <button class="btn btn-success" onclick="saveBill()">
                        <i class="fas fa-save"></i> SAVE BILL & DOWNLOAD PDF
                    </button>
                    <button class="btn" onclick="clearForm()">
                        <i class="fas fa-redo"></i> Clear
                    </button>
                </div>

                <!-- Bill Preview -->
                <div id="billPreview"></div>
            </div>

            <!-- Search Section -->
            <div id="search" style="display: none;">
                <h2 style="text-align: center; margin-bottom: 2rem; color: #333;">
                    <i class="fas fa-search"></i> Search Customer Bills
                </h2>
                
                <div class="form-group">
                    <label>Search by Name</label>
                    <input type="text" id="searchInput" class="search-box" placeholder="Type customer name..." onkeyup="searchBills()">
                </div>

                <div id="billsList" style="min-height: 200px;">
                    <p style="text-align: center; color: #666; padding: 3rem;">
                        No bills yet. Create first bill above!
                    </p>
                </div>
            </div>

            <!-- Profit Section -->
            <div id="profit" style="display: none;">
                <h2 style="text-align: center; margin-bottom: 2rem; color: #333;">
                    <i class="fas fa-calculator"></i> Profit Calculator
                </h2>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Selling Price</label>
                        <input type="number" id="sellPrice" placeholder="Selling price">
                    </div>
                    <div class="form-group">
                        <label>Cost Price</label>
                        <input type="number" id="costPrice" placeholder="Cost price">
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Quantity</label>
                    <input type="number" id="profitQty" value="1">
                </div>
                
                <button class="btn btn-success" onclick="calcProfit()" style="width: 100%; margin-top: 1rem;">
                    Calculate Profit
                </button>
                
                <div id="profitResult" style="margin-top: 2rem; padding: 2rem; background: #f8f9fa; border-radius: 10px; text-align: center; display: none;">
                    <h3>Today's Total Profit: <span id="totalProfit">$0</span></h3>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==================== MAIN DATA ====================
        let bills = JSON.parse(localStorage.getItem('aihub_bills')) || [];
        let profitData = JSON.parse(localStorage.getItem('aihub_profit')) || { total: 0 };

        // ==================== NOTIFICATION ====================
        function showNotification(message, type = 'success') {
            const notif = document.getElementById('notification');
            notif.textContent = message;
            notif.className = `notification ${type} show`;
            setTimeout(() => {
                notif.classList.remove('show');
            }, 3000);
        }

        // ==================== SAVE BILL ====================
        function saveBill() {
            const name = document.getElementById('customerName').value.trim();
            const phone = document.getElementById('customerPhone').value.trim();
            const amount = parseFloat(document.getElementById('billAmount').value) || 0;
            const payment = document.getElementById('paymentType').value;
            const items = document.getElementById('items').value.trim();

            if (!name || amount <= 0) {
                showNotification('Please enter name and valid amount!', 'error');
                return;
            }

            // Create bill object
            const bill = {
                id: Date.now(),
                name: name,
                phone: phone,
                amount: amount,
                payment: payment,
                items: items,
                date: new Date().toLocaleString()
            };

            // Save to database
            bills.unshift(bill);
            localStorage.setItem('aihub_bills', JSON.stringify(bills));

            // Show preview
            showBillPreview(bill);

            // Update stats
            updateStats();

            // Clear form
            clearForm();

            // Notification
            showNotification(`✅ Bill saved for ${name}! PDF Ready!`);
        }

        // ==================== SHOW BILL PREVIEW ====================
        function showBillPreview(bill) {
            const preview = document.getElementById('billPreview');
            preview.innerHTML = `
                <div class="bill-header">
                    <h2 style="color: #ff6b6b; margin-bottom: 0.5rem;">THE AI HUB</h2>
                    <p style="color: #666; font-size: 1.1rem;">Harshwardhan Singh Lodhi</p>
                    <p style="color: #666;">KV2642240@gmail.com | @_verma_karan08</p>
                </div>
                <div style="text-align: center; margin: 2rem 0;">
                    <h3>${bill.name}</h3>
                    ${bill.phone ? `<p>📞 ${bill.phone}</p>` : ''}
                    <div style="font-size: 2rem; color: #27ae60; margin: 1rem 0;">
                        ₹${bill.amount.toLocaleString()}
                    </div>
                    <p><strong>Payment:</strong> ${bill.payment}</p>
                    ${bill.items ? `<p><strong>Items:</strong> ${bill.items}</p>` : ''}
                    <p style="color: #666; font-size: 0.9rem;">${bill.date}</p>
                </div>
                <div style="text-align: center; margin-top: 2rem;">
                    <button class="btn btn-success" onclick="downloadPDF(${bill.id})">
                        📥 DOWNLOAD PDF
                    </button>
                </div>
            `;
            preview.style.display = 'block';
        }

        // ==================== DOWNLOAD PDF ====================
        function downloadPDF(billId) {
            const bill = bills.find(b => b.id === billId);
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.setFontSize(20);
            doc.text('THE AI HUB', 105, 30, { align: 'center' });
            doc.setFontSize(12);
            doc.text('Harshwardhan Singh Lodhi', 105, 45, { align: 'center' });
            doc.text('KV2642240@gmail.com | @_verma_karan08', 105, 55, { align: 'center' });

            doc.setFontSize(16);
            doc.text(bill.name, 105, 80, { align: 'center' });
            doc.text(`₹${bill.amount.toLocaleString()}`, 105, 100, { align: 'center' });
            doc.text(`Payment: ${bill.payment}`, 105, 115, { align: 'center' });
            
            if (bill.items) {
                doc.text(bill.items, 20, 135);
            }
            
            doc.text(bill.date, 105, doc.internal.pageSize.height - 20, { align: 'center' });

            doc.save(`bill_${bill.name}_${new Date().getTime()}.pdf`);
            showNotification('📥 PDF Downloaded Successfully!');
        }

        // ==================== SEARCH BILLS ====================
        function searchBills() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const container = document.getElementById('billsList');
            
            if (!query) {
                container.innerHTML = '<p style="text-align: center; color: #666; padding: 3rem;">Type name to search...</p>';
                return;
            }

            const filtered = bills.filter(bill => 
                bill.name.toLowerCase().includes(query)
            );

            if (filtered.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #666; padding: 3rem;">No bills found!</p>';
                return;
            }

            container.innerHTML = filtered.map(bill => `
                <div class="customer-card" onclick="showBillPreview(${bill.id})">
                    <div class="customer-name">${bill.name}</div>
                    <div class="customer-amount">₹${bill.amount.toLocaleString()}</div>
                    <div class="customer-date">${bill.date}</div>
                    <div style="margin-top: 1rem; color: #666; font-size: 0.9rem;">
                        ${bill.payment} • ${bill.phone || 'No phone'}
                    </div>
                </div>
            `).join('');
        }

        // ==================== UPDATE STATS ====================
        function updateStats() {
            document.getElementById('totalBills').textContent = bills.length;
            document.getElementById('totalProfit').textContent = `$${profitData.total.toLocaleString()}`;
            
            const udhari = bills.filter
