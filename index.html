<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 THE AI HUB - Premium Shopkeeper Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary-gold: #FFD700;
            --primary-blue: #1E3A8A;
            --dark-bg: #0F0F23;
            --glass-bg: rgba(255,255,255,0.1);
            --glass-border: rgba(255,255,255,0.2);
            --success: #10B981;
            --danger: #EF4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--dark-bg) 0%, #1A1A3A 50%, #2A2A4A 100%);
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }

        /* Premium Badge */
        .premium-badge {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(45deg, var(--primary-gold), #FFED4E);
            color: var(--dark-bg);
            padding: 1rem 1.8rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.1rem;
            box-shadow: 0 15px 35px rgba(255,215,0,0.4);
            z-index: 10000;
            animation: premiumGlow 2s ease-in-out infinite alternate;
        }

        @keyframes premiumGlow {
            0% { box-shadow: 0 10px 30px rgba(255,215,0,0.4); }
            100% { box-shadow: 0 15px 45px rgba(255,215,0,0.6); }
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--primary-blue), #3B82F6);
            padding: 1.5rem 0;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(20px);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
        }

        .logo {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(45deg, var(--primary-gold), #FFED4E);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(255,215,0,0.6);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .contact-info {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .contact-item {
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 1rem 1.8rem;
            border-radius: 30px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            font-weight: 500;
        }

        .contact-item:hover {
            background: rgba(255,255,255,0.25);
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        /* Main Layout */
        .main-container {
            max-width: 1400px;
            margin: 2.5rem auto;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 2.5rem;
        }

        /* Sidebar */
        .sidebar {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            border-radius: 30px;
            padding: 2.5rem;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
            border: 1px solid var(--glass-border);
            height: fit-content;
            position: sticky;
            top: 120px;
        }

        .sidebar h3 {
            color: var(--primary-gold);
            margin-bottom: 2.5rem;
            font-size: 1.5rem;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
        }

        .nav-btn {
            width: 100%;
            padding: 1.4rem 1.8rem;
            margin-bottom: 1.5rem;
            border: none;
            border-radius: 25px;
            background: rgba(255,255,255,0.15);
            color: white;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 500;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 1.2rem;
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
        }

        .nav-btn:hover, .nav-btn.active {
            background: linear-gradient(135deg, var(--primary-gold), #FFED4E);
            color: var(--dark-bg);
            transform: translateX(20px) scale(1.03);
            box-shadow: 0 20px 50px rgba(255,215,0,0.5);
        }

        /* Content */
        .content {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            border-radius: 30px;
            padding: 3.5rem;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
            border: 1px solid var(--glass-border);
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
            animation: slideInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Profit Card */
        .profit-card {
            background: linear-gradient(135deg, rgba(255,215,0,0.2), rgba(255,237,78,0.15));
            padding: 3rem;
            border-radius: 30px;
            text-align: center;
            margin-bottom: 3rem;
            border: 2px solid rgba(255,215,0,0.3);
            backdrop-filter: blur(15px);
        }

        .profit-amount {
            font-size: 4.5rem;
            font-weight: 800;
            background: linear-gradient(45deg, var(--primary-gold), #FFED4E);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 1rem 0;
            text-shadow: 0 0 40px rgba(255,215,0,0.6);
        }

        /* Forms */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 2.5rem;
        }

        .form-group {
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 1rem;
            font-weight: 600;
            color: var(--primary-gold);
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 1.4rem 1.5rem;
            border: 2px solid var(--glass-border);
            border-radius: 20px;
            font-size: 1.1rem;
            background: rgba(255,255,255,0.12);
            color: white;
            backdrop-filter: blur(15px);
            transition: all 0.4s ease;
            font-family: inherit;
        }

        .form-group input::placeholder {
            color: rgba(255,255,255,0.6);
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--primary-gold);
            box-shadow: 0 0 25px rgba(255,215,0,0.4);
            background: rgba(255,255,255,0.18);
        }

        /* Buttons */
        .btn {
            background: linear-gradient(135deg, var(--primary-gold), #FFED4E);
            color: var(--dark-bg);
            border: none;
            padding: 1.4rem 3rem;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 15px 35px rgba(255,215,0,0.4);
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            text-decoration: none;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            transform: translateY(-6px);
            box-shadow: 0 25px 50px rgba(255,215,0,0.6);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #6B7280, #4B5563);
            color: white;
            box-shadow: 0 15px 35px rgba(107,114,128,0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success), #059669);
            color: white;
            box-shadow: 0 15px 35px rgba(16,185,129,0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger), #DC2626);
            color: white;
            box-shadow: 0 15px 35px rgba(239,68,68,0.4);
        }

        /* List Items */
        .entry-item {
            background: rgba(255,255,255,0.12);
            padding: 2rem;
            border-radius: 25px;
            margin-bottom: 2rem;
            border: 1px solid var(--glass-border);
            transition: all 0.4s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .entry-item:hover {
            background: rgba(255,255,255,0.2);
            transform: translateX(15px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .entry-info h4 {
            color: var(--primary-gold);
            margin-bottom: 0.5rem;
            font-size: 1.3rem;
        }

        .entry-meta {
            color: rgba(255,255,255,0.7);
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
        }

        .entry-amount {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--success);
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: rgba(255,255,255,0.1);
            padding: 2rem;
            border-radius: 25px;
            text-align: center;
            border: 1px solid var(--glass-border);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-10px);
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary-gold);
            margin-bottom: 0.5rem;
        }

        /* Search */
        .search-container {
            position: relative;
            margin-bottom: 2.5rem;
        }

        .search-input {
            width: 100%;
            padding: 1.4rem 1.5rem 1.4rem 4rem;
            border: 2px solid var(--glass-border);
            border-radius: 20px;
            background: rgba(255,255,255,0.12);
            color: white;
            font-size: 1.1rem;
        }

        .search-icon {
            position: absolute;
            left: 1.5rem;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.6);
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .main-container {
                grid-template-columns: 1fr;
                gap: 2rem;
            }
            .sidebar {
                position: static;
            }
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
