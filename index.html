<!DOCTYPE html>
<html>
<head>
  <title>The AI Hub - Official Manager</title>
  <style>
    body { background: #1a1a2e; color: #fff; font-family: 'Segoe UI', sans-serif; padding: 20px; }
    .card { background: #242442; padding: 20px; border-radius: 15px; border: 1px solid #4a4a75; box-shadow: 0 4px 15px rgba(128, 0, 128, 0.3); max-width: 600px; margin: auto; }
    input, select { background: #161625; color: #fff; border: 1px solid #7b2cbf; padding: 12px; width: 100%; margin-bottom: 10px; border-radius: 8px; box-sizing: border-box; }
    button { background: #7b2cbf; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .footer { text-align: center; color: #aaa; margin-top: 20px; }
    .record { border-bottom: 1px solid #4a4a75; padding: 10px 0; }
  </style>
</head>
<body>

<div class="card">
  <h2 style="color: #c77dff; text-align: center;">THE AI HUB</h2>
  <h4 style="text-align: center;">Harshwardhan Singh Lodhi</h4>
  
  <input type="text" id="name" placeholder="Customer Name">
  <input type="number" id="amount" placeholder="Amount">
  <select id="type"><option value="Udhaar">Udhaar</option><option value="Profit">Profit</option></select>
  <button onclick="saveRecord()">ADD RECORD</button>
  
  <input type="text" id="search" placeholder="🔍 Search Customer..." onkeyup="filterData()">
  <div id="dataList"></div>
</div>

<div class="footer">
  <p>Contact: kv2642240@gmail.com | Insta: @_verma_karan08</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const supabase = supabase.createClient('https://ageofnbquxjwwfpflskn.supabase.co', 'YO
https://ageofnbquxjwwfpflskn.supabase.co');

  async function saveRecord() {
    const name = document.getElementById('name').value;
    const amount = document.getElementById('amount').value;
    const type = document.getElementById('type').value;
    await supabase.from('transactions').insert([{ name, amount, type, status: 'Pending' }]);
    location.reload();
  }

  async function loadData() {
    const { data } = await supabase.from('transactions').select('*');
    let html = "<h3>Transactions:</h3>";
    data.forEach(item => {
      html += `<div class="record">
        <strong>${item.name}</strong> - ₹${item.amount} (${item.status}) 
        <button onclick="generateBill('${item.name}', '${item.amount}')">Bill</button>
      </div>`;
    });
    document.getElementById('dataList').innerHTML = html;
  }

  function generateBill(n, a) {
    const bill = `BILL FOR ${n}\nAmount: ₹${a}\nStatus: Paid\nPowered by: The AI Hub\nOwner: Harshwardhan Singh Lodhi`;
    const blob = new Blob([bill], {type: "text/plain"});
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = n + "_Bill.txt";
    link.click();
  }

  loadData();
</script>
</body>
</html>
