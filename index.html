<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE AI HUB - Premium Shopkeeper Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #2a2a4a 50%, #1a1a3a 100%);
            min-height: 100vh;
            color: #fff;
        }

        .premium-badge {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            color: #1a1a3a;
            padding: 1rem 1.5rem;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.4);
            z-index: 10000;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { box-shadow: 0 10px 30px rgba(255, 215, 0, 0.4); }
            to { box-shadow: 0 10px 40px rgba(255, 215, 0, 0.6); }
        }

        .header {
            background: linear-gradient(45deg, #1e3c72, #2a5298);
            padding: 1.5rem 0;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: bold;
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
        }

        .contact-info {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .contact-item {
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.8rem 1.5rem;
            border-radius: 25px;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }

        .contact-item:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .main-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 2rem;
        }

        .sidebar {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 2.5rem 2rem;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            height: fit-content;
        }

        .sidebar h3 {
            color: #ffd700;
            margin-bottom: 2rem;
            font-size: 1.4rem;
            text-align: center;
        }

        .nav-btn {
            width: 100%;
            padding: 1.2rem;
            margin-bottom: 1.2rem;
            border: none;
            border-radius: 20px;
            background: linear-gradient(45deg, rgba(255,255,255,0.2), rgba(255,255,255,0.1));
            color: #fff;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.4s ease;
            display: flex;
            align-items: center;
            gap: 1rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .nav-btn:hover, .nav-btn.active {
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            color: #1a1a3a;
            transform: translateX(15px) scale(1.02);
            box-shadow: 0 15px 40px rgba(255, 215, 0, 0.4);
        }

        .content {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 3rem;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .profit-card {
            background: linear-gradient(45deg, rgba(255,215,0,0.2), rgba(255,237,78,0.2));
            padding: 2.5rem;
            border-radius: 25px;
            text-align: center;
            margin-bottom: 2.5rem;
            border: 2px solid rgba(255,215,0,0.3);
        }

        .profit-amount {
            font-size: 4rem;
            font-weight: bold;
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 1rem 0;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
        }

        .form-group {
            margin-bottom: 2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.8rem;
            font-weight: 600;
            color: #ffd700;
            font-size: 1.1rem;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 1.2rem;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 15px;
            font-size: 1.1rem;
            background: rgba(255,255,255,0.1);
            color: #fff;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .form-group input::placeholder {
            color: rgba(255,255,255,0.6);
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .btn {
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            color: #1a1a3a;
            border: none;
            padding: 1.2rem 2.5rem;
            border-radius: 15px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            transition: all 0.3s ease;
            margin-right: 1rem;
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.4);
        }

        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(255, 215, 0, 0.6);
        }

        .stock-item {
            background: rgba(255,255,255,0.1);
            padding: 1.5rem;
            border-radius: 20px;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 5px solid #ffd700;
            transition: all 0.3s ease;
        }

        .stock-item:hover {
            background: rgba(255,255,255,0.2);
            transform: translateX(10px);
        }

        .stock-item.critical {
            border-left-color: #ff6b6b;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255,107,107,0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255,107,107,0); }
            100% { box-shadow: 0 0 0 0 rgba(255,107,107,0); }
        }

        .customer-list, #udhariList {
            max-height: 400px;
            overflow-y: auto;
        }

        .customer-item {
            background: rgba(255,255,255,0.1);
            padding: 1.5rem;
            border-radius: 20px;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .customer-item:hover {
            background: rgba(255,255,255,0.2);
            transform: translateX(10px);
        }

        .bill-btn {
            background: linear-gradient(45deg, #4ecdc4, #44a08d);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
                padding: 0 1rem;
            }
            
            .nav-container {
                flex-direction: column;
                gap: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="premium-badge">
        <i class="fas fa-crown"></i> PREMIUM
    </div>

    <header class="header">
        <div class="nav-container">
            <div class="logo">
                <i class="fas fa-brain"></i> THE AI HUB
            </div>
            <div class="contact-info">
                <a href="mailto:KV2642240@gmail.com" class="contact-item">
                    <i class="fas fa-envelope"></i>
                    KV2642240@gmail.com
                </a>
                <a href="https://instagram.com/_verma_karan08" target="_blank" class="contact-item">
                    <i class="fab fa-instagram"></i>
                    _verma_karan08
                </a>
                <div class="contact-item">
                    <i class="fas fa-user-tie"></i>
                    Harshwardhan Singh Lodhi
                </div>
            </div>
        </div>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <h3><i class="fas fa-gem"></i> Premium Dashboard</h3>
            <button class="nav-btn active" onclick="showSection('profit')">
                <i class="fas fa-chart-line"></i> 1. Profit Calculator
            </button>
            <button class="nav-btn" onclick="showSection('udhari')">
                <i class="fas fa-credit-card"></i> 2. Udhari Management
            </button>
            <button class="nav-btn" onclick="showSection('stock')">
                <i class="fas fa-boxes"></i> 3. Stock Reminder
            </button>
        </aside>

        <main class="content">
            <!-- Profit Calculator Section -->
            <section id="profit" class="section active">
                <div class="profit-card">
                    <h2><i class="fas fa-rupee-sign"></i> Total Profit Today</h2>
                    <div class="profit-amount" id="totalProfit">₹ 0</div>
                    <small>Premium Profit Tracking</small>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-tag"></i> Selling Price (₹)</label>
                    <input type="number" id="sellingPrice" placeholder="Enter selling price">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-coins"></i> Cost Price (₹)</label>
                    <input type="number" id="costPrice" placeholder="Enter cost price">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-box"></i> Quantity</label>
                    <input type="number" id="quantity" placeholder="Enter quantity" value="1">
                </div>
                <button class="btn" onclick="calculateProfit()">
                    <i class="fas fa-calculator"></i> Calculate Profit
                </button>
                <button class="btn" onclick="resetProfit()" style="background: linear-gradient(45deg, #6c757d, #495057);">
                    <i class="fas fa-redo"></i> Reset
                </button>
            </section>

            <!-- Udhari Management Section -->
            <section id="udhari" class="section">
                <h2><i class="fas fa-credit-card"></i> Premium Udhari Management</h2>
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Customer Name</label>
                    <input type="text" id="udhariCustomer" placeholder="Enter customer name">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-rupee-sign"></i> Udhari Amount (₹)</label>
                    <input type="number" id="udhariAmount" placeholder="Enter udhari amount">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-calendar"></i> Due Date</label>
                    <input type="date" id="dueDate">
                </div>
                <button class="btn" onclick="addUdhari()">
                    <i class="fas fa-plus-circle"></i> Add Udhari Record
                </button>
                
                <h3 style="margin-top: 3rem; color: #ffd700;">📋 Udhari Records</h3>
                <div id="udhariList" style="margin-top: 1.5rem;"></div>
            </section>

            <!-- Stock Reminder Section -->
            <section id="stock" class="section">
                <h2><i class="fas fa-boxes"></i> Premium Stock Reminder</h2>
                <p style="color: #ffd700; margin-bottom: 2rem;">Get alerts when stock is low! 🔄</p>

                <div style="display: flex; gap: 1.5rem; margin-bottom: 2.5rem;">
                    <div class="form-group" style="flex: 1;">
                        <label><i class="fas fa-cube"></i> Product Name</label>
                        <input type="text" id="productName" placeholder="Enter product name">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label><i class="fas fa-hashtag"></i> Current Stock</label>
                        <input type="number" id="currentStock" placeholder="Current quantity">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label><i class="fas fa-exclamation-triangle"></i> Min Stock Alert</label>
                        <input type="number" id="minStock" placeholder="Alert when below">
                    </div>
                </div>

                <button class="btn" onclick="addStock()">
                    <i class="fas fa-plus"></i> Add Stock Item
                </button>
                
                <h3 style="margin-top: 3rem; color: #ffd700;">📦 Stock Status</h3>
                <div id="stockList" style="margin-top: 1.5rem;"></div>
            </section>
        </main>
    </div>

    <script>
        let totalProfit = 0;
        let udhariRecords = JSON.parse(localStorage.getItem('udhari')) || [];
        let stockItems = JSON.parse(localStorage.getItem('stockItems')) || [];

        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
            event.target.classList.add('active');
        }

        function calculateProfit() {
            const sellingPrice = parseFloat(document.getElementById('sellingPrice').value) || 0;
            const costPrice = parseFloat(document.getElementById('costPrice').value) || 0;
            const quantity = parseInt(document.getElementById('quantity').value) || 1;

            const profit = (sellingPrice - costPrice) * quantity;
            totalProfit += profit;
