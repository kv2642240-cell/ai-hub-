<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>The AI Hub - Official Manager</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { background: #0f0f1a; color: #fff; font-family: sans-serif; padding: 20px; }
        .container { max-width: 450px; margin: auto; background: #1a1a2e; padding: 20px; border-radius: 15px; border: 1px solid #7b2cbf; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; background: #161625; color: white; border: 1px solid #7b2cbf; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #7b2cbf; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; }
        .record { background: #242442; padding: 10px; margin: 5px 0; border-radius: 5px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align:center;">THE AI HUB</h2>
    <p style="text-align:center; font-size: 0.8em; color: #aaa;">Owner: Harshwardhan Singh Lodhi (Karan)</p>
    
    <input type="text" id="cName" placeholder="Customer Name">
    <input type="text" id="cService" placeholder="Service">
    <input type="number" id="cAmount" placeholder="Amount (₹)">
    <select id="cType">
        <option value="Profit">Profit</option>
        <option value="Loss/Udhaar">Loss / Udhaar</option>
    </select>
    
    <button onclick="saveAndDownload()">DOWNLOAD BILL & SAVE</button>
    
    <h3>Dashboard (Ledger)</h3>
    <div id="list"></div>
</div>

<script>
    function saveAndDownload() {
        const { jsPDF } = window.jspdf;
        let n = document.getElementById('cName').value;
        let s = document.getElementById('cService').value;
        let a = document.getElementById('cAmount').value;
        let t = document.getElementById('cType').value;

        if (!n || !a) return alert("Sab bharein!");

        // 1. PDF Download Logic
        const doc = new jsPDF();
        doc.text("THE AI HUB - INVOICE", 70, 20);
        doc.text("Owner: Harshwardhan Singh Lodhi (Karan)", 20, 30);
        doc.text("------------------------------------", 20, 40);
        doc.text("Customer: " + n, 20, 50);
        doc.text("Service: " + s, 20, 60);
        doc.text("Amount: ₹" + a, 20, 70);
        doc.text("Type: " + t, 20, 80);
        doc.save("Bill_" + n + ".pdf");

        // 2. Save to Ledger
        let db = JSON.parse(localStorage.getItem('hub') || "[]");
        db.push({ n, s, a, t });
        localStorage.setItem('hub', JSON.stringify(db));
        location.reload();
    }

    function loadData() {
        let db = JSON.parse(localStorage.getItem('hub') || "[]");
        let list = document.getElementById('list');
        db.forEach(i => {
            list.innerHTML += `<div class="record">
                <span>${i.n} (${i.t})</span> <b>₹${i.a}</b>
            </div>`;
        });
    }
    loadData();
</script>
</body>
</html>
