<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>The AI Hub Manager</title>
    <style>
        body { background: #0f0f1a; color: white; font-family: sans-serif; padding: 20px; }
        .box { background: #1a1a2e; padding: 20px; border-radius: 15px; border: 1px solid #7b2cbf; max-width: 400px; margin: auto; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; background: #161625; color: white; border: 1px solid #7b2cbf; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #7b2cbf; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 5px; }
        .record { background: #242442; padding: 12px; margin-top: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #7b2cbf; }
    </style>
</head>
<body>

<div class="box">
    <h2 style="text-align:center; color:#c77dff;">THE AI HUB</h2>
    <p style="text-align:center; opacity:0.8;">CEO: Harshwardhan Singh Lodhi</p>
    
    <input type="text" id="name" placeholder="Customer Name">
    <input type="number" id="amt" placeholder="Amount (₹)">
    <select id="type"><option value="Udhaar">Udhaar</option><option value="Profit">Profit</option></select>
    <button onclick="saveData()">SAVE RECORD</button>
    
    <input type="text" id="search" placeholder="🔍 Search name..." onkeyup="displayData()">
    <div id="list"></div>
</div>

<div style="text-align:center; margin-top:20px; color:#aaa; font-size:0.9em;">
    <p>📧 kv2642240@gmail.com</p>
    <p>📸 Instagram: @_verma_karan08</p>
</div>

<script>
    // Data Save karne ka function
    function saveData() {
        let name = document.getElementById('name').value;
        let amt = document.getElementById('amt').value;
        let type = document.getElementById('type').value;

        if (!name || !amt) {
            alert("Please saari details bharo!");
            return;
        }

        let db = JSON.parse(localStorage.getItem('myHubData') || "[]");
        db.push({ id: Date.now(), name, amt, type });
        localStorage.setItem('myHubData', JSON.stringify(db));
        
        document.getElementById('name').value = '';
        document.getElementById('amt').value = '';
        displayData();
    }

    // Data dikhane ka function
    function displayData() {
        let db = JSON.parse(localStorage.getItem('myHubData') || "[]");
        let q = document.getElementById('search').value.toLowerCase();
        let list = document.getElementById('list');
        list.innerHTML = "";

        db.filter(i => i.name.toLowerCase().includes(q)).forEach(i => {
            let div = document.createElement('div');
            div.className = "record";
            div.innerHTML = `
                <span><strong>${i.name}</strong><br>₹${i.amt} (${i.type})</span>
                <div>
                    <button onclick="genBill('${i.name}', '${i.amt}')" style="width:auto; padding:5px 8px; background:#555;">Bill</button>
                    <button onclick="delData(${i.id})" style="width:auto; padding:5px 8px; background:#e63946;">Clear</button>
                </div>
            `;
            list.appendChild(div);
        });
    }

    // Clear karne ka function
    function delData(id) {
        let db = JSON.parse(localStorage.getItem('myHubData')).filter(i => i.id !== id);
        localStorage.setItem('myHubData', JSON.stringify(db));
        displayData();
    }

    // Bill generate karne ka function
    function genBill(n, a) {
        let txt = `--- THE AI HUB BILL ---\nCustomer: ${n}\nAmount: ₹${a}\nStatus: Settled\nCEO: Harshwardhan Singh Lodhi\n-----------------------\nContact: kv2642240@gmail.com`;
        let blob = new Blob([txt], {type: 'text/plain'});
        let link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = n + "_Bill.txt";
        link.click();
    }

    displayData();
</script>
</body>
</html>
