<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THEAi Hub - Shopkeeper Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .tabs {
            display: flex;
            background: #f8f9fa;
            border-radius: 15px;
            padding: 5px;
            margin-bottom: 30px;
        }

        .tab-btn {
            flex: 1;
            padding: 15px;
            border: none;
            background: transparent;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input, select, button {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b, #ee5a52);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }

        .card h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .card .value {
            font-size: 2em;
            font-weight: bold;
            color: #333;
        }

        .customers-table, .bills-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .customers-table th,
        .customers-table td,
        .bills-table th,
        .bills-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        .customers-table th,
        .bills-table th {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-weight: 600;
        }

        .search-box {
            margin-bottom: 20px;
        }

        .action-btn {
            padding: 8px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin: 2px;
        }

        .btn-success { background: #28a745; color: white; }
        .btn-warning { background: #ffc107; color: #333; }
        .btn-info { background: #17a2b8; color: white; }

        @media (max-width: 768px) {
            .tabs { flex-direction: column; }
            .dashboard-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🛒 THEAi Hub</h1>
        <p>Shopkeeper Management System | Founder: Harshwardhan Singh Lodhi</p>
        <p><small>Follow: <a href="https://www.instagram.com/_verma_karan08/" target="_blank" style="color: #ffd700;">@_verma_karan08</a></small></p>
    </div>

    <div class="container">
        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('dashboard')">📊 Dashboard</button>
            <button class="tab-btn" onclick="showTab('customers')">👥 Customers</button>
            <button class="tab-btn" onclick="showTab('bills')">💰 Bills</button>
            <button class="tab-btn" onclick="showTab('add')">➕ Add Entry</button>
        </div>

        <!-- Dashboard Tab -->
        <div id="dashboard" class="tab-content active">
            <div class="dashboard-grid">
                <div class="card">
                    <h3>Total Profit</h3>
                    <div class="value" id="totalProfit">₹0</div>
                </div>
                <div class="card">
                    <h3>Total Loans</h3>
                    <div class="value" id="totalLoans">₹0</div>
                </div>
                <div class="card">
                    <h3>Total Customers</h3>
                    <div class="value" id="totalCustomers">0</div>
                </div>
                <div class="card">
                    <h3>Pending Bills</h3>
                    <div class="value" id="pendingBills">0</div>
                </div>
            </div>
        </div>

        <!-- Customers Tab -->
        <div id="customers" class="tab-content">
            <div class="search-box">
                <input type="text" id="customerSearch" placeholder="🔍 Search customer by name..." onkeyup="searchCustomers()">
            </div>
            <table class="customers-table" id="customersTable">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Phone</th>
                        <th>Total Loan</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <!-- Bills Tab -->
        <div id="bills" class="tab-content">
            <div class="search-box">
                <input type="text" id="billSearch" placeholder="🔍 Search bills by customer name..." onkeyup="searchBills()">
            </div>
            <table class="bills-table" id="billsTable">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Customer</th>
                        <th>Type</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <!-- Add Entry Tab -->
        <div id="add" class="tab-content">
            <form id="entryForm">
                <div class="form-group">
                    <label>Customer Name *</label>
                    <input type="text" id="customerName" required>
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="tel" id="customerPhone">
                </div>
                <div class="form-group">
                    <label>Transaction Type *</label>
                    <select id="transactionType" required>
                        <option value="">Select Type</option>
                        <option value="loan">💸 Loan Given</option>
                        <option value="payment">✅ Loan Payment</option>
                        <option value="sale">🛒 Sale Bill</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Amount (₹) *</label>
                    <input type="number" id="amount" required min="0" step="0.01">
                </div>
                <div class="form-group">
                    <label>Notes</label>
                    <textarea id="notes" rows="3" placeholder="Additional details..."></textarea>
                </div>
                <button type="submit" class="btn">💾 Save Entry</button>
            </form>
        </div>
    </div>

    <script>
        // Data Storage
        let customers = JSON.parse(localStorage.getItem('customers')) || {};
        let bills = JSON.parse(localStorage.getItem('bills')) || [];
        let nextCustomerId = parseInt(localStorage.getItem('nextCustomerId')) || 1;

        // Initialize app
        document.addEventListener('DOMContentLoaded', function() {
            updateDashboard();
            renderCustomers();
            renderBills();
        });

        // Tab switching
        function showTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
            
            if (tabName === 'customers') renderCustomers();
            if (tabName === 'bills') renderBills();
        }

        // Add new entry
        document.getElementById('entryForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const customerName = document.getElementById('customerName').value.trim();
            const customerPhone = document.getElementById('customerPhone').value.trim();
            const transactionType = document.getElementById('transactionType').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const notes = document.getElementById('notes').value.trim();
            const date = new Date().toLocaleDateString('en-IN');

            // Create or update customer
            if (!customers[customerName]) {
                customers[customerName] = {
                    id: nextCustomerId++,
                    phone: customerPhone,
                    totalLoan: 0,
                    name: customerName
                };
            }

            // Update loan balance
            if (transactionType === 'loan') {
                customers[customerName].totalLoan += amount;
            } else if (transactionType === 'payment') {
                customers[customerName].totalLoan = Math.max(0, customers[customerName].totalLoan - amount);
            }

            // Add bill
            const bill = {
                id: Date.now(),
                date: date,
                customer: customerName,
                type: transactionType,
                amount: amount,
                status: transactionType === 'sale' ? 'paid' : 'pending',
                notes: notes
            };
            bills.unshift(bill);

            // Save to localStorage
            localStorage.setItem('customers', JSON.stringify(customers));
            localStorage.setItem('bills', JSON.stringify(bills));
            localStorage.setItem('nextCustomerId', nextCustomerId);

            // Reset form
            this.reset();
            updateDashboard();
            
            alert('✅ Entry added successfully!');
        });

        // Dashboard calculations
        function updateDashboard() {
            let totalProfit = 0;
            let totalLoans = 0;
            let totalCustomersCount = Object.keys(customers).length;
            let pendingBillsCount = bills.filter(bill => bill.status === 'pending').length;

            bills.forEach(bill => {
                if (bill.type === 'sale') {
                    totalProfit += bill.amount;
                }
            });

            Object.values(customers).forEach(customer => {
                totalLoans += customer.totalLoan;
            });

            document.getElementById('totalProfit').textContent = `₹${totalProfit.toLocaleString()}`;
            document.getElementById('totalLoans').textContent = `₹${totalLoans.toLocaleString()}`;
            document.getElementById('totalCustomers').textContent = totalCustomersCount;
            document.getElementById('pendingBills').textContent = pendingBillsCount;
        }

        // Render customers table
        function renderCustomers() {
            const tbody = document.querySelector('#customersTable tbody');
            tbody.innerHTML = '';

            Object.values(customers).forEach(customer => {
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td>${customer.name}</td>
                    <td>${customer.phone || '-'}</td>
                    <td>₹${customer.totalLoan.toLocaleString()}</td>
                    <td>
                        <button class="action-btn btn-info" onclick="viewCustomerBills('${customer.name}')">View Bills</button>
                        <button class="action-btn btn-warning" onclick="editCustomer('${customer.name}')">Edit</button>
                    </td>
                `;
            });
        }

        // Render bills table
        function renderBills(filteredBills = bills) {
            const tbody = document.querySelector('#billsTable tbody');
            tbody.innerHTML = '';

            filteredBills.forEach(bill => {
                const row = tbody.insertRow();
                const status = bill.status === 'paid' ? '✅ Paid' : '⏳ Pending';
                row.innerHTML = `
                    <td>${bill.date}</td>
                    <td>${bill.customer}</td>
                    <td>${bill.type === 'loan' ? '💸 Loan' : bill.type === 'payment' ? '✅ Payment' : '🛒 Sale'}</td>
                    <td>₹${bill.amount.toLocaleString()}</td>
                    <td>${status}</td>
                    <td>
                        <button class="action-btn btn-success" onclick="downloadBill(${bill.id})">📥 Download</button>
                        ${bill.status === 'pending' ? `<button class="action-btn btn-success" onclick="markPaid(${bill.id})">Mark Paid</button>` : ''}
                    </td>
                `;
            });
        }

        // Search functions
        function searchCustomers() {
            const searchTerm = document.getElementById('customerSearch').value.toLowerCase();
            const filtered = Object.values(customers).filter(customer => 
                customer.name.toLowerCase().includes(searchTerm)
            );
            
            const tbody = document.querySelector('#customersTable tbody');
            tbody.innerHTML = '';
            
            filtered.forEach(customer => {
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td>${customer.name}</td>
                    <td>${customer.phone || '-'}</td>
                    <td>₹${customer.totalLoan.toLocaleString()}</td>
                    <td>
                        <button class="action-btn btn-info" onclick="viewCustomerBills('${customer.name}')">View Bills</button>
                    </td>
                `;
            });
        }

        function searchBills() {
            const searchTerm = document.getElementById('billSearch').value.toLowerCase();
            const filtered = bills.filter(bill => 
                bill.customer.toLowerCase().includes(searchTerm)
            );
            renderBills(filtered);
        }

        // Additional functions
        function viewCustomerBills(customerName) {
            const customerBills = bills.filter(bill => bill.customer === customerName);
            renderBills(customerBills);
            showTab('bills');
        }

        function markPaid(billId) {
            const bill = bills.find(b => b.id === billId);
            if (bill) {
                bill.status = 'paid';
                localStorage.setItem('bills', JSON.stringify(bills));
                updateDashboard();
                renderBills();
            }
        }

        function downloadBill(billId) {
            const bill = bills.find(b => b.id === billId);
            if (bill) {
                const billText = `
THEAi Hub - Bill Receipt
========================
Date: ${bill.date}
Customer: ${bill.customer}
Type: ${bill.type === 'loan' ? 'Loan' : bill.type === 'payment' ? 'Payment' : 'Sale'}
Amount: ₹${bill.amount.toLocaleString()}
Status: ${bill.status === 'paid' ? 'PAID' : 'PENDING'}
Notes: ${bill.notes || 'N/A'}
========================
Founder: Harshwardhan Singh Lodhi
Instagram: @_verma_karan08
                `;
                
                const blob = new Blob([billText], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `THEAiHub_${bill.customer}_${bill.date}.txt`;
                a.click();
                URL.revokeObjectURL(url);
            }
        }

        function editCustomer(customerName) {
            const customer = customers[customerName];
            if (customer) {
                document.getElementById('customerName').value = customer.name;
                document.getElementById('customerPhone').value = customer.phone || '';
                alert(`Edit customer details and save new transactions for ${customerName}`);
            }
        }
    </script>
</body>
</html>
