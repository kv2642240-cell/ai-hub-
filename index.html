<!DOCTYPE html>
<html>
<head>
  <title>The AI Hub - Digital Khata</title>
</head>
<body>
  <h2>The AI Hub: Transaction Entry</h2>
  
  <input type="text" id="name" placeholder="Customer Name">
  <input type="number" id="amount" placeholder="Amount">
  <select id="type">
    <option value="Cash">Cash</option>
    <option value="Udhaar">Udhaar</option>
  </select>
  <button onclick="saveData()">Save Data</button>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Aapka URL yahan set ho gaya hai
    const supabaseUrl = 'https://ageofnbquxjwwfpflskn.supabase.co';
    
    // Yahan apni 'anon' wali API Key paste karein
    const supabaseKey = Https://ageofnbquxjwwfpflskn.supabase.co
    
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);

    async function saveData() {
      const name = document.getElementById('name').value;
      const amount = document.getElementById('amount').value;
      const type = document.getElementById('type').value;

      // Supabase ke table mein data insert karna
      const { data, error } = await supabase
        .from('transactions') // Table ka naam
        .insert([{ name: name, amount: amount, type: type }]);
      
      if (error) {
        alert("Error: " + error.message);
      } else {
        alert("Data saved successfully!");
        // Input fields ko khali karne ke liye
        document.getElementById('name').value = '';
        document.getElementById('amount').value = '';
      }
    }
  </script>
</body>
</html>
