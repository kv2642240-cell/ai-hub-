<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>The AI Hub - Official Bill</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 20px; }
        .bill-box { background: white; width: 300px; padding: 20px; border: 2px solid #000; margin: auto; box-shadow: 5px 5px 15px #ccc; }
        .bill-header { text-align: center; border-bottom: 2px solid #000; margin-bottom: 15px; }
        .bill-details { margin: 15px 0; }
        .footer-note { text-align: center; font-size: 12px; margin-top: 20px; border-top: 1px dashed #000; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body>

<div id="printArea" class="bill-box">
    <div class="bill-header">
        <h2 style="margin:0;">THE AI HUB</h2>
        <p style="margin:0; font-size:12px;">Official Invoice</p>
    </div>
    <div class="bill-details">
        <p><strong>Customer:</strong> <span id="cName"></span></p>
        <p><strong>Service:</strong> <span id="cProduct"></span></p>
        <p><strong>Amount:</strong> ₹<span id="cAmt"></span></p>
        <p><strong>Date:</strong> <span id="cDate"></span></p>
    </div>
    <div class="footer-note">
        <p>Owner: Harshwardhan Singh Lodhi</p>
        <p>Thank you for choosing The AI Hub!</p>
    </div>
</div>

<div style="text-align:center; margin-top:20px;">
    <button class="no-print" onclick="window.print()">PRINT / SAVE AS PDF</button>
</div>

<script>
    // URL se data lena
    const params = new URLSearchParams(window.location.search);
    document.getElementById('cName').innerText = params.get('name');
    document.getElementById('cProduct').innerText = params.get('product');
    document.getElementById('cAmt').innerText = params.get('amt');
    document.getElementById('cDate').innerText = new Date().toLocaleDateString();
</script>
</body>
</html>
