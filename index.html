<!DOCTYPE html>
<html>
<head>
  <title>The AI Hub - Official Manager</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background-color: #121212; color: #ffffff; padding: 20px; }
    .card { background-color: #1e1e1e; padding: 20px; margin: 10px 0; border-radius: 10px; border: 1px solid #333; }
    input, select { background: #333; color: white; border: none; padding: 10px; margin: 5px; border-radius: 5px; }
    button { background: #00e676; color: black; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; font-weight: bold; }
    .footer { margin-top: 30px; padding: 15px; background: #000; text-align: center; color: #aaa; border-radius: 10px; }
  </style>
</head>
<body>
  <h1>The AI Hub - Official Manager</h1>
  
  <div class="card">
    <input type="text" id="name" placeholder="Customer Name">
    <input type="number" id="amount" placeholder="Amount">
    <select id="type"><option value="Profit">Profit</option><option value="Loss">Loss</option></select>
    <button onclick="saveData()">Save Record</button>
  </div>

  <div id="dataList"></div>

  <div class="footer">
    <p>Contact: <a href="mailto:kv2642240@gmail.com" style="color: #00e676;">Email</a> | <a href="https://www.instagram.com/_verma_karan08" style="color: #00e676;">Instagram</a></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // URL successfully added
    const supabaseUrl = 'https://ageofnbquxjwwfpflskn.supabase.co';
    const supabaseKey =Https://ageofnbquxjwwfpflskn.supabase.co

Isko add krke doYahan apni 'anon' key daalo
    
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);

    async function saveData() {
      const name = document.getElementById('name').value;
      const amount = document.getElementById('amount').value;
      const type = document.getElementById('type').value;
      const date = new Date().toLocaleDateString();
      const gst = (amount * 0.18).toFixed(2);
      const total = (parseFloat(amount) + parseFloat(gst)).toFixed(2);

      const { error } = await supabase.from('transactions').insert([{ name, amount, type, date, gst, total }]);
      if (error) alert("Error: " + error.message);
      else { alert("Saved successfully!"); loadData(); }
    }

    async function loadData() {
      const { data } = await supabase.from('transactions').select('*');
      let html = "<h3>Records:</h3>";
      data.forEach(item => {
        html += `<div class="card">
          <strong>${item.name}</strong> - Total: ₹${item.total} (${item.type})<br>
          <small>GST: ₹${item.gst} | Date: ${item.date}</small>
        </div>`;
      });
      document.getElementById('dataList').innerHTML = html;
    }
    loadData();
  </script>
</body>
</html>
