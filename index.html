<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>The AI Hub - Official Manager</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { background: #0f0f1a; color: white; font-family: sans-serif; padding: 15px; }
        .box { max-width: 400px; margin: auto; background: #1a1a2e; padding: 20px; border-radius: 15px; border: 1px solid #7b2cbf; }
        .about { font-size: 0.85em; color: #ccc; text-align: center; margin-bottom: 15px; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; border-radius: 5px; border: none; }
        button { padding: 8px 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .record { background: #242442; padding: 10px; margin-top: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .footer { text-align: center; margin-top: 20px; font-size: 0.9em; }
    </style>
</head>
<body>

<div class="box">
    <h2 style="text-align:center;">THE AI HUB</h2>
    <div class="about">Managed by: <b>Harshwardhan Singh Lodhi (Karan)</b><br>Professional AI/ML Solutions</div>
    
    <input type="text" id="name" placeholder="Customer Name">
    <input type="text" id="product" placeholder="Service">
    <input type="number" id="amt" placeholder="Amount (₹)">
    <select id="type">
        <option value="Paid">Paid</option>
        <option value="Udhaar">Udhaar</option>
    </select>
    <button onclick="addData()" style="width:100%; background:#7b2cbf; color:white;">ADD TO LEDGER</button>
    
    <div id="list" style="margin-top:20px;"></div>
    
    <div class="footer">
        <a href="mailto:kv2642240@gmail.com" style="color:#c77dff; margin-right:15px;">📧 Gmail</a>
        <a href="https://www.instagram.com/_verma_karan08" target="_blank" style="color:#c77dff;">📸 Instagram</a>
    </div>
</div>

<script>
    function addData() {
        let n = document.getElementById('name').value;
        let p = document.getElementById('product').value;
        let a = document.getElementById('amt').value;
        let t = document.getElementById('type').value;
        if(!n || !a) return alert("Details bharein!");
        
        let db = JSON.parse(localStorage.getItem('hub') || "[]");
        db.push({id: Date.now(), n, p, a, t});
        localStorage.setItem('hub', JSON.stringify(db));
        location.reload();
    }

    function generateBill(n, p, a, t) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.text("THE AI HUB - INVOICE", 60, 20);
        doc.text("Manager: Harshwardhan Singh Lodhi (Karan)", 20, 30);
        doc.text("Customer: " + n, 20, 50);
        doc.text("Service: " + p, 20, 60);
        doc.text("Amount: ₹" + a, 20, 70);
        doc.text("Status: " + t, 20, 80);
        doc.save("Bill_" + n + ".pdf");
    }

    function loadLedger() {
        let db = JSON.parse(localStorage.getItem('hub') || "[]");
        let list = document.getElementById('list');
        db.forEach(i => {
            list.innerHTML += `<div class="record">
                <div><strong>${i.n} (${i.t})</strong><br>₹${i.a}</div>
                <div>
                    <button onclick="generateBill('${i.n}','${i.p}','${i.a}','${i.t}')" style="background:green; color:white;">Bill</button>
                    <button onclick="del(${i.id})" style="background:red; color:white;">Clear</button>
                </div>
            </div>`;
        });
    }
    
    function del(id) {
        let db = JSON.parse(localStorage.getItem('hub')).filter(i => i.id !== id);
        localStorage.setItem('hub', JSON.stringify(db));
        location.reload();
    }
    loadLedger();
</script>
</body>
</html>
