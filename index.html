<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The AI Hub - Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; padding: 15px; }
        .container { max-width: 500px; margin: auto; background: #161b22; padding: 20px; border-radius: 15px; border: 1px solid #30363d; }
        h2 { text-align: center; color: #58a6ff; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: white; box-sizing: border-box; }
        .btn-add { width: 100%; padding: 12px; background: #238636; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .stats { display: flex; justify-content: space-between; margin: 20px 0; padding: 15px; background: #21262d; border-radius: 10px; border-left: 5px solid #58a6ff; }
        .item { background: #21262d; padding: 15px; margin-top: 10px; border-radius: 10px; border: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; }
        .btn-pdf { background: #30363d; color: #58a6ff; border: 1px solid #58a6ff; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-clear { background: #d76e00; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .founder-link { display: block; text-align: center; margin-top: 25px; color: #8b949e; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <h2>THE AI HUB</h2>
    <input type="text" id="search" placeholder="🔍 Search Customer..." onkeyup="filterData()">
    <input type="text" id="custName" placeholder="Customer Name">
    <input type="text" id="service" placeholder="Service Name">
    <input type="number" id="amount" placeholder="Amount (₹)">
    <select id="entryType"><option value="Paid">Paid (Profit)</option><option value="Udhari">Due (Udhari)</option></select>
    <button class="btn-add" onclick="saveEntry()">ADD RECORD</button>
    <div class="stats">
        <div>Profit<br><span id="totalProfit" style="color:#3fb950;">₹0</span></div>
        <div style="border-left: 1px solid #30363d;">Udhari<br><span id="totalUdhari" style="color:#f85149;">₹0</span></div>
    </div>
    <div id="list"></div>
    <a href="about.html" class="founder-link">About Founder (Karan)</a>
</div>
<script>
    function saveEntry() {
        const name = document.getElementById('custName').value;
        const service = document.getElementById('service').value;
        const amount = document.getElementById('amount').value;
        const type = document.getElementById('entryType').value;
        if(!name || !amount) return alert("Details bharo bhai!");
        const entry = { id: Date.now(), name, service, amount, type, date: new Date().toLocaleString() };
        let data = JSON.parse(localStorage.getItem('aiHubData') || "[]");
        data.push(entry);
        localStorage.setItem('aiHubData', JSON.stringify(data));
        window.location.reload();
    }
    function render() {
        let data = JSON.parse(localStorage.getItem('aiHubData') || "[]");
        let p = 0, u = 0;
        data.forEach((item, index) => {
            if(item.type === "Paid") p += Number(item.amount); else u += Number(item.amount);
            document.getElementById('list').innerHTML += `
                <div class="item">
                    <div><strong>${item.name}</strong> <small>(${item.type})</small><br>₹${item.amount} - ${item.service}</div>
                    <div>
                        <button class="btn-pdf" onclick="generatePDF(${index})">Bill</button>
                        ${item.type === 'Udhari' ? `<button class="btn-clear" onclick="clearBill(${index})">Paid</button>` : ''}
                    </div>
                </div>`;
        });
        document.getElementById('totalProfit').innerText = "₹" + p;
        document.getElementById('totalUdhari').innerText = "₹" + u;
    }
    function clearBill(i) {
        let data = JSON.parse(localStorage.getItem('aiHubData'));
        data[i].type = "Paid";
        localStorage.setItem('aiHubData', JSON.stringify(data));
        window.location.reload();
    }
    function filterData() {
        const q = document.getElementById('search').value.toLowerCase();
        document.querySelectorAll('.item').forEach(el => el.style.display = el.innerText.toLowerCase().includes(q) ? 'flex' : 'none');
    }
    function generatePDF(i) {
        const d = JSON.parse(localStorage.getItem('aiHubData'))[i];
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.setFontSize(22); doc.text("THE AI HUB BILL", 105, 20, {align:"center"});
        doc.setFontSize(12); doc.text(`Date: ${d.date}`, 20, 40);
        doc.text(`Customer: ${d.name}`, 20, 50);
        doc.text(`Service: ${d.service}`, 20, 60);
        doc.text(`Status: ${item.type}`, 20, 70);
        doc.line(20, 80, 190, 80);
        doc.setFontSize(16); doc.text(`TOTAL: Rs. ${d.amount}`, 20, 95);
        doc.setFontSize(10); doc.text("Founder: Harshwardhan Singh Lodhi", 20, 120);
        doc.save(`Bill_${d.name}.pdf`);
    }
    render();
</script>
</body>
</html>
