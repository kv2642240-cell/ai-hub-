<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE AI HUB - Shopkeeper Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .header {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            padding: 1rem 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
        }

        .logo {
            font-size: 2rem;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .contact-info {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .contact-item {
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 25px;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.2);
        }

        .contact-item:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }

        .main-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 2rem;
        }

        .sidebar {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            height: fit-content;
        }

        .sidebar h3 {
            color: #4ecdc4;
            margin-bottom: 1.5rem;
            font-size: 1.3rem;
        }

        .nav-btn {
            width: 100%;
            padding: 1rem;
            margin-bottom: 1rem;
            border: none;
            border-radius: 15px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .nav-btn:hover, .nav-btn.active {
            transform: translateX(10px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .content {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .profit-card {
            background: linear-gradient(45deg, #ffecd2, #fcb69f);
            padding: 2rem;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 2rem;
        }

        .profit-amount {
            font-size: 3rem;
            font-weight: bold;
            color: #27ae60;
            margin: 0.5rem 0;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #555;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 1rem;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #4ecdc4;
        }

        .btn {
            background: linear-gradient(45deg, #4ecdc4, #44a08d);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            margin-right: 1rem;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(78, 205, 196, 0.4);
        }

        .btn-danger {
            background: linear-gradient(45deg, #ff6b6b, #ee5a52);
        }

        .btn-success {
            background: linear-gradient(45deg, #27ae60, #2ecc71);
        }

        .customer-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .customer-item {
            background: #f8f9fa;
            padding: 1.5rem;
            border-radius: 15px;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .customer-item:hover {
            background: #e3f2fd;
            transform: translateX(5px);
        }

        .bill-btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
                padding: 0 1rem;
            }
            
            .nav-container {
                flex-direction: column;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="nav-container">
            <div class="logo">
                <i class="fas fa-brain"></i> THE AI HUB
            </div>
            <div class="contact-info">
                <a href="mailto:KV2642240@gmail.com" class="contact-item">
                    <i class="fas fa-envelope"></i>
                    KV2642240@gmail.com
                </a>
                <a href="https://instagram.com/_verma_karan08" target="_blank" class="contact-item">
                    <i class="fab fa-instagram"></i>
                    _verma_karan08
                </a>
                <div class="contact-item">
                    <i class="fas fa-user"></i>
                    Founder: Harshwardhan Singh Lodhi
                </div>
            </div>
        </div>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <h3><i class="fas fa-bars"></i> Quick Navigation</h3>
            <button class="nav-btn active" onclick="showSection('profit')">
                <i class="fas fa-chart-line"></i> Profit Calculator
            </button>
            <button class="nav-btn" onclick="showSection('udhari')">
                <i class="fas fa-credit-card"></i> Udhari Management
            </button>
            <button class="nav-btn" onclick="showSection('customers')">
                <i class="fas fa-users"></i> Customer Records
            </button>
        </aside>

        <main class="content">
            <!-- Profit Calculator Section -->
            <section id="profit" class="section active">
                <div class="profit-card">
                    <h2><i class="fas fa-rupee-sign"></i> Total Profit</h2>
                    <div class="profit-amount" id="totalProfit">₹ 0</div>
                    <small>Updated Today</small>
                </div>

                <div class="form-group">
                    <label>Selling Price (₹)</label>
                    <input type="number" id="sellingPrice" placeholder="Enter selling price">
                </div>
                <div class="form-group">
                    <label>Cost Price (₹)</label>
                    <input type="number" id="costPrice" placeholder="Enter cost price">
                </div>
                <div class="form-group">
                    <label>Quantity</label>
                    <input type="number" id="quantity" placeholder="Enter quantity" value="1">
                </div>
                <button class="btn btn-success" onclick="calculateProfit()">
                    <i class="fas fa-calculator"></i> Calculate Profit
                </button>
                <button class="btn" onclick="resetProfit()">
                    <i class="fas fa-redo"></i> Reset
                </button>
            </section>

            <!-- Udhari Management Section -->
            <section id="udhari" class="section">
                <h2><i class="fas fa-credit-card"></i> Udhari / Credit Management</h2>
                <div class="form-group">
                    <label>Customer Name</label>
                    <input type="text" id="udhariCustomer" placeholder="Enter customer name">
                </div>
                <div class="form-group">
                    <label>Udhari Amount (₹)</label>
                    <input type="number" id="udhariAmount" placeholder="Enter udhari amount">
                </div>
                <div class="form-group">
                    <label>Due Date</label>
                    <input type="date" id="dueDate">
                </div>
                <button class="btn btn-success" onclick="addUdhari()">
                    <i class="fas fa-plus"></i> Add Udhari
                </button>
                
                <h3 style="margin-top: 2rem;">Udhari List</h3>
                <div id="udhariList"></div>
            </section>

            <!-- Customer Records Section -->
            <section id="customers" class="section">
                <h2><i class="fas fa-users"></i> Customer Management</h2>
                
                <div class="form-group">
                    <label>Search Customer</label>
                    <input type="text" id="searchCustomer" placeholder="Search by name..." onkeyup="searchCustomers()">
                </div>

                <div style="display: flex; gap: 1rem; margin-bottom: 2rem;">
                    <div class="form-group" style="flex: 1;">
                        <label>New Customer Name</label>
                        <input type="text" id="newCustomerName" placeholder="Enter customer name">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Amount (₹)</label>
                        <input type="number" id="customerAmount" placeholder="Enter amount">
                    </div>
                    <button class="btn btn-success" onclick="addCustomer()" style="margin-top: 24px;">
                        <i class="fas fa-user-plus"></i> Add Customer
                    </button>
                </div>

                <div class="customer-list" id="customerList">
                    <p>No customers found. Add your first customer!</p>
                </div>
            </section>
        </main>
    </div>

    <script>
        let totalProfit = 0;
        let customers = JSON.parse(localStorage.getItem('customers')) || [];
        let udhariRecords = JSON.parse(localStorage.getItem('udhari')) || [];

        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
            event.target.classList.add('active');
        }

        function calculateProfit() {
            const sellingPrice = parseFloat(document.getElementById('sellingPrice').value) || 0;
            const costPrice = parseFloat(document.getElementById('costPrice').value) || 0;
            const quantity = parseInt(document.getElementById('quantity').value) || 1;

            const profit = (sellingPrice - costPrice) * quantity;
            totalProfit += profit;
            
            document.getElementById('totalProfit').textContent = `₹ ${totalProfit.toLocaleString()}`;
            
            // Save to localStorage
            localStorage.setItem('totalProfit', totalProfit);
            
            alert(`Profit: ₹${profit.toLocaleString()} | Total Profit: ₹${totalProfit.toLocaleString()}`);
        }

        function resetProfit() {
            totalProfit = 0;
            document.getElementById('totalProfit').textContent = '₹ 0';
            document.getElementById('sellingPrice').value = '';
            document.getElementById('costPrice').value = '';
            document.getElementById('quantity').value = '1';
            localStorage.setItem('totalProfit', totalProfit);
        }

        function addUdhari() {
            const customer = document.getElementById('udhariCustomer').value;
            const amount = parseFloat(document.getElementById('udhariAmount').value) || 0;
            const dueDate = document.getElementById('dueDate').value;

            if (!customer || !amount) {
                alert('Please fill customer name and amount');
                return;
            }

            udhariRecords.push({
                id: Date.now(),
                customer,
                amount,
                dueDate,
                date: new Date().toLocaleDateString()
            });

            localStorage.setItem('udhari', JSON.stringify(udhariRecords));
            displayUdhari();
            document.getElementById('udhariCustomer').value = '';
            document.getElementById('udhariAmount').value = '';
            document.getElementById('dueDate').value = '';
        }

        function displayUdhari() {
            const list = document.getElementById('udhariList');
            if (udhariRecords.length === 0) {
                list.innerHTML = '<p>No udhari records found.</p>';
                return;
            }

            list.innerHTML = udhariRecords.map(record => `
                <div class="customer-item">
                    <div>
                        <strong>${record.customer}</strong><br>
                        ₹${record.amount.toLocaleString()} - Due: ${record.dueDate}
                    </div>
                    <div>
                        <small>${record.date}</small>
                    </div>
                </div>
            `).join('');
        }

        function addCustomer() {
            const name = document.getElementById('newCustomerName').value;
            const amount = parseFloat(document.getElementById('customerAmount').value) || 0;

            if (!name) {
                alert('Please enter customer name');
                return;
            }

            const customer = {
                id: Date.now(),
                name,
                amount,
                date: new Date().toLocaleDateString()
            };

            customers.push(customer);
            localStorage.setItem('customers', JSON.stringify(customers));
            displayCustomers();
            document.getElementById('newCustomerName').value = '';
            document.getElementById('customerAmount').value = '';
        }

        function displayCustomers(filteredCustomers = customers) {
            const list = document.getElementById('customerList');
            if (filteredCustomers.length === 0) {
                list.innerHTML = '<p>No customers found.</p>';
                return;
            }

            list.innerHTML = filteredCustomers.map(customer => `
                <div class="customer-item">
                    <div>
                        <strong>${customer.name}</strong><br>
                        <small>Amount: ₹${customer.amount.toLocaleString()} | ${customer.date}</small>
                    </div>
                    <button class="bill-btn" onclick="generateBill(${customer.id})">
                        <i class="fas fa-download"></i> Bill
                    </button>
                </div>
            `).join('');
        }

        function searchCustomers() {
            const query = document.getElementById('searchCustomer').value.toLowerCase();
            const filtered = customers.filter(c => c.name.toLowerCase().includes(query));
            displayCustomers(filtered);
        }

        function generateBill(customerId) {
            const customer = customers.find(c => c.id === customerId);
            if (!customer) return;

            const billContent = `
                THE AI HUB
                ================
                Customer: ${customer.name}
                Amount: ₹${customer.amount.toLocaleString()}
                Date: ${customer.date}
                Founder: Harshwardhan Singh Lodhi
                Contact: KV2642240@gmail.com
                ================
                Thank You! Visit Again
            `;

            const blob = new Blob([billContent], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `bill_${customer.name}_${customer.date}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // Initialize
        window.onload = function() {
            const savedProfit = parseFloat(localStorage.getItem('totalProfit')) || 0;
            totalProfit = savedProfit;
            document.getElementById('totalProfit').textContent = `₹ ${totalProfit.toLocaleString()}`;
            displayCustomers();
            displayUdhari();
        }
    </script>
</body>
</html>
