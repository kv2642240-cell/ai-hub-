<!DOCTYPE html>
<html>
<head>
    <title>The AI Hub</title>
    <style>
        body{background:#0f0f1a; color:white; font-family:sans-serif; padding:20px;}
        .box{max-width:400px; margin:auto; background:#1a1a2e; padding:20px; border-radius:15px; border:1px solid #7b2cbf;}
        input, select{width:100%; padding:10px; margin:5px 0; border-radius:5px;}
        button{width:100%; padding:10px; background:#7b2cbf; color:white; border:none; border-radius:5px;}
    </style>
</head>
<body>
<div class="box">
    <h2>THE AI HUB</h2>
    <input type="text" id="name" placeholder="Name">
    <input type="text" id="product" placeholder="Service">
    <input type="number" id="amt" placeholder="Amount">
    <select id="type"><option value="Paid">Paid</option><option value="Udhaar">Udhaar</option></select>
    <button onclick="saveData()">SAVE TO CLOUD</button>
    <div id="list"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const config = {
        apiKey: "AIzaSyA9Z3bDd3DRR6Qo0Y5J48WmYjbTOUaiHzU",
        authDomain: "the-ai-hub-7ac90.firebaseapp.com",
        projectId: "the-ai-hub-7ac90",
        storageBucket: "the-ai-hub-7ac90.firebasestorage.app",
        messagingSenderId: "994986142901",
        appId: "1:994986142901:web:9082bf93a819d9d454a2fc"
    };

    const db = getFirestore(initializeApp(config));
    window.db = db; window.collection = collection; window.addDoc = addDoc; 
    window.getDocs = getDocs; window.deleteDoc = deleteDoc; window.doc = doc;

    window.saveData = async () => {
        let n = document.getElementById('name').value;
        let p = document.getElementById('product').value;
        let a = document.getElementById('amt').value;
        let t = document.getElementById('type').value;
        await addDoc(collection(db, "ledger"), { n, p, a, t });
        location.reload();
    }
</script>
<script>
    async function load() {
        let snap = await getDocs(collection(window.db, "ledger"));
        let list = document.getElementById('list');
        snap.forEach(d => {
            let i = d.data();
            list.innerHTML += `<div style="background:#242442; margin-top:10px; padding:10px;">
                ${i.n} - ₹${i.a} (${i.t}) <button onclick="del('${d.id}')">Clear</button></div>`;
        });
    }
    window.del = async (id) => { await deleteDoc(doc(window.db, "ledger", id)); location.reload(); }
    setTimeout(load, 2000);
</script>
</body>
</html>
