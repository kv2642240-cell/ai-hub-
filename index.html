<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The AI Hub - Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0b0e14; color: #e0e0e0; padding: 20px; }
        .card { background: #161b22; padding: 25px; border-radius: 20px; max-width: 450px; margin: auto; border: 1px solid #30363d; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #30363d; background: #0d1117; color: white; }
        button { width: 100%; padding: 12px; background: #58a6ff; color: #000; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 5px; }
        .item { background: #21262d; padding: 15px; margin-top: 12px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; }
        .stats { display: flex; justify-content: space-between; margin: 20px 0; font-weight: bold; }
        .badge { padding: 4px 8px; border-radius: 5px; font-size: 0.8em; }
    </style>
</head>
<body>
<div class="card">
    <h2 style="text-align:center; color:#58a6ff;">THE AI HUB</h2>
    <input type="text" id="search" placeholder="🔍 Search Customer..." onkeyup="filterEntries()">
    <input type="text" id="name" placeholder="Customer Name">
    <input type="text" id="service" placeholder="Service">
    <input type="number" id="amt" placeholder="Amount">
    <select id="type"><option value="Profit">Paid</option><option value="Udhari">Due (Udhari)</option></select>
    <button onclick="addEntry()">ADD ENTRY</button>
    <div class="stats">
        <div>Profit: ₹<span id="tP">0</span></div>
        <div>Due: ₹<span id="tU">0</span></div>
    </div>
    <div id="history"></div>
    <a href="about.html" style="color:#8b949e; display:block; margin-top:20px; text-align:center; text-decoration:none;">About Founder</a>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
    function addEntry() {
        let entry = { n: document.getElementById('name').value, s: document.getElementById('service').value, a: document.getElementById('amt').value, t: document.getElementById('type').value, d: new Date().toLocaleDateString() };
        let data = JSON.parse(localStorage.getItem('ledger') || "[]");
        data.push(entry);
        localStorage.setItem('ledger', JSON.stringify(data));
        location.reload();
    }
    function filterEntries() {
        let q = document.getElementById('search').value.toLowerCase();
        document.querySelectorAll('.item').forEach(i => i.style.display = i.innerText.toLowerCase().includes(q) ? 'flex' : 'none');
    }
    function clearUdhari(i) {
        let d = JSON.parse(localStorage.getItem('ledger'));
        d[i].t = "Profit"; 
        localStorage.setItem('ledger', JSON.stringify(d));
        location.reload();
    }
    let data = JSON.parse(localStorage.getItem('ledger') || "[]");
    let p=0, u=0;
    data.forEach((item, i) => {
        if(item.t === "Profit") p += parseInt(item.a); else u += parseInt(item.a);
        document.getElementById('history').innerHTML += `
        <div class="item">
            <div><strong>${item.n}</strong><br>${item.s} | ₹${item.a} <span class="badge" style="background:${item.t=='Profit'?'#238636':'#da3633'}">${item.t}</span></div>
            <div>
                <button onclick="downloadBill(${i})" style="background:#30363d; color:white; width:auto; padding:5px 10px;">PDF</button>
                ${item.t=='Udhari' ? `<button onclick="clearUdhari(${i})" style="background:#f0883e; color:white; width:auto; padding:5px 10px;">Clear</button>` : ''}
            </div>
        </div>`;
    });
    document.getElementById('tP').innerText = p; document.getElementById('tU').innerText = u;
    function downloadBill(i) {
        let d = JSON.parse(localStorage.getItem('ledger'))[i];
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.setFontSize(22); doc.text("THE AI HUB - INVOICE", 55, 20);
        doc.setFontSize(12); doc.text(`Date: ${d.d}`, 20, 40);
        doc.text(`Customer: ${d.n}`, 20, 50);
        doc.text(`Service: ${d.s}`, 20, 60);
        doc.text(`Status: ${d.t}`, 20, 70);
        doc.line(20, 80, 190, 80);
        doc.setFontSize(16); doc.text(`Amount: ₹${d.a}`, 20, 95);
        doc.setFontSize(10); doc.text("Thank you for choosing The AI Hub!", 20, 110);
        doc.save(`${d.n}_Invoice.pdf`);
    }
</script>
</body>
